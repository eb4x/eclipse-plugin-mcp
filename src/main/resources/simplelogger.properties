# slf4j-simple config for the embedded Jetty/MCP-SDK/reactor stack. The binding is
# private to this bundle (nested jar), so this quiets our libraries without touching
# Eclipse's own slf4j/logback wiring.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.logFile=System.err
